---
# Deploy this on Servarr (10.10.40.11)
# Instructions:
# 1. Copy this file and promtail-config-servarr.yaml to Servarr machine
# 2. Run: docker compose -f docker-compose-servarr.yaml up -d

services:
  promtail:
    container_name: promtail
    image: grafana/promtail:2.9.4
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config-servarr.yaml:/etc/promtail/promtail-config.yaml:ro
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    network_mode: bridge