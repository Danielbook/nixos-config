esphome:
  name: gym-presence
  friendly_name: gym-presence

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret gym_presence_api_key

ota:
  - platform: esphome
    password: !secret gym_presence_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Gym-Presence Fallback Hotspot"
    password: !secret gym_presence_fallback_password

captive_portal:
    