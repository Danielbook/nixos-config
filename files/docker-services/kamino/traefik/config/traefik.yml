api:
  dashboard: true
  debug: false

global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: cloudflare
        domains:
          - main: "local.bookorjeman.com"
            sans:
              - "*.local.bookorjeman.com"

serversTransport:
  insecureSkipVerify: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /dynamic
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: daniel@bookorjeman.se
      storage: /certificates/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # prod
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging
      dnsChallenge:
        provider: cloudflare
        disablePropagationCheck: true # uncomment this if you have issues pulling certificates through cloudflare, By setting this flag to true disables the need to wait for the propagation of the TXT record to all authoritative name servers.
        delayBeforeCheck: 10s # uncomment along with disablePropagationCheck if needed to ensure the TXT record is ready before verification is attempted
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  filepath: "/logs/traefik.log"
  level: INFO # (Default: error) DEBUG, INFO, WARN, ERROR, FATAL, PANIC

accessLog:
  addInternals: true
  bufferingSize: 100
  filepath: "/logs/access.log"
