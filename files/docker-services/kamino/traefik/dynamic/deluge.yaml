http:
  routers:
    deluge:
      entryPoints:
        - "websecure"
      rule: "Host(`deluge.local.bookorjeman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: deluge

  services:
    deluge:
      loadBalancer:
        servers:
          - url: "http://10.10.40.11:8112/"
        passHostHeader: true
