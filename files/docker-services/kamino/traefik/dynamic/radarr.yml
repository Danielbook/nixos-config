http:
  routers:
    radarr:
      entryPoints:
        - "websecure"
      rule: "Host(`radarr.local.bookorjeman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: radarr

  services:
    radarr:
      loadBalancer:
        servers:
          - url: "http://10.10.40.11:7878"
        passHostHeader: true
