http:
  routers:
    jellyfin:
      entryPoints:
        - "websecure"
      rule: "Host(`jellyfin.local.bookorjeman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: jellyfin

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://10.10.40.12:8096"
        passHostHeader: true
