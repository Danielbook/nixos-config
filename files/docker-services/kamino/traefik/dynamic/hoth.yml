http:
  routers:
    hoth:
      entryPoints:
        - "websecure"
      rule: "Host(`hoth.local.bookorjeman.com`)"
      middlewares:
        - default-headers
      tls:
        certResolver: cloudflare
      service: hoth

  services:
    hoth:
      loadBalancer:
        servers:
          - url: "https://10.10.30.12:8006"
        passHostHeader: true
        serversTransport: proxmox-transport

  serversTransports:
    proxmox-transport:
      insecureSkipVerify: true
