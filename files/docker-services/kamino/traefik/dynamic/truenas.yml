http:
  routers:
    truenas:
      entryPoints:
        - "websecure"
      rule: "Host(`truenas.local.bookorjeman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: truenas

  services:
    truenas:
      loadBalancer:
        servers:
          - url: "http://10.10.40.10"
        passHostHeader: true
