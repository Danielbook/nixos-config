http:
  routers:
    nzbget:
      entryPoints:
        - "websecure"
      rule: "Host(`nzbget.local.bookorjeman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: nzbget

  services:
    nzbget:
      loadBalancer:
        servers:
          - url: "http://10.10.40.11:6789/"
        passHostHeader: true
