# Load wallpapers
# Wallpaper daemon is managed by systemd service modules

# Monitor settings - managed by HyprDynamicMonitors
# Configuration is automatically generated at ~/.config/hypr/monitors.conf
source = ~/.config/hypr/monitors.conf

# Execute your favorite apps at launch
exec-once = hypridle
exec-once = bitwarden --hidden  # Start Bitwarden minimized for SSH agent
# noctalia-shell managed by systemd user service (bar, notifications, lock screen)
exec-once = wl-paste --watch cliphist store
exec-once = wlsunset -l 52.23 -L 21.01
exec-once = systemctl --user start hyprland-session.target

# GTK Wayland environment variables to fix black rendering
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Input device setting
input {
    kb_layout = us,se
    kb_options = grp:alt_space_toggle,ctrl:nocaps
    repeat_delay = 200
    repeat_rate = 40

    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        natural_scroll = true
        scroll_factor = 0.12
    }

    sensitivity = 0.5 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}

# General settings
general {
    allow_tearing = false
    border_size = 1
    col.active_border = rgb(b7bdf8)   # Catppuccin Lavender
    col.inactive_border = rgb(313244) # Catppuccin Surface0
    gaps_in = 3
    gaps_out = 3
    layout = master
}

# Window decorations settings
decoration {
    rounding = 8
    blur {
        enabled = false
        size = 3
        passes = 1
    }
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Animations settings
animations {
  #    enabled = false
  #    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  #    animation = windows, 1, 7, myBezier
  #    animation = windowsOut, 1, 7, default, popin 80%
  #    animation = border, 1, 10, default
  #    animation = borderangle, 1, 8, default
  #    animation = fade, 1, 7, default
  #    animation = workspaces, 1, 6, default
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 3, wind, slide
    animation = windowsIn, 1, 3, winIn, slide
    animation = windowsOut, 1, 2, winOut, slide
    animation = windowsMove, 1, 3, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 15, liner, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, wind
}

# Layouts settings
dwindle {
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    orientation = left
    mfact = 0.50
}

# Touchpad gesture settings (Hyprland 0.51+ syntax)
# 3-finger horizontal swipe to switch workspaces
gesture = 3, horizontal, workspace

cursor {
  # no_hardware_cursors = true  # Try enabling hardware cursors after NVIDIA Prime fixes
}

xwayland {
  # force_zero_scaling = true  # Commented out - can cause black app rendering issues
}

# Misc settings
misc {
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
    disable_splash_rendering = true
    allow_session_lock_restore = true # Allow recovery from crashed lockscreen
    vrr = 2
}

device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

# Window rules
# Center specific windows
windowrule = center 1, class:^(.blueman-manager-wrapped)$
windowrule = center 1, class:^(gnome-calculator|org\.gnome\.Calculator)$
windowrule = center 1, class:^(nm-connection-editor)$
windowrule = center 1, class:^(org.pulseaudio.pavucontrol)$
windowrule = center 1, class:^(Bitwarden)$
windowrule = center 1, initialTitle:^(_crx_.*)$ # Centered Bitwarden extension

# Float specific windows
windowrule = float, class:^(.blueman-manager-wrapped)$
windowrule = float, class:^(gnome-calculator|org\.gnome\.Calculator)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(Bitwarden)$
windowrule = float, title:^(Albert)$
windowrule = float, title:^(MainPicker)$
windowrule = float, initialTitle:^(_crx_.*)$ # Float Bitwarden extension on Brave
windowrule = float, initialTitle:^(Extension:.*)$ # Float all Firefox extension popups

# Remove border for specific applications
windowrule = noborder, title:^(Albert)$
windowrule = noborder, title:^(.*is sharing (your screen|a window)\.)$ # Screen share indicators

# Set size for specific windows
windowrule = size 50%, class:^(.blueman-manager-wrapped)$
windowrule = size 50%, class:^(nm-connection-editor)$
windowrule = size 50%, class:^(org.pulseaudio.pavucontrol)$
windowrule = size 70%, class:^(Bitwarden)$

# Keep focus on specific windows when they open
windowrule = stayfocused, class:^(.blueman-manager-wrapped)$
windowrule = stayfocused, class:^(gnome-calculator|org\.gnome\.Calculator)$
windowrule = stayfocused, class:^(org.pulseaudio.pavucontrol)$
windowrule = stayfocused, class:^(com.gabm.satty)$ # Satty screenshot annotation tool
windowrule = stayfocused, title:^(Albert)$

# Assign applications to specific workspaces
# Workspace 1: Terminals
windowrule = workspace 1, class:^(Ghostty)$
windowrule = workspace 1, class:^(Alacritty)$
windowrule = workspace 1, class:^(kitty)$
windowrule = workspace 1, class:^(foot)$

# Workspace 2: Browsers
windowrule = workspace 2, class:^(firefox)$
windowrule = workspace 2, class:^(Firefox)$
windowrule = workspace 2, class:^(google-chrome)$
windowrule = workspace 2, class:^(Google-chrome)$
windowrule = workspace 2, class:^(chromium)$
windowrule = workspace 2, class:^(Chromium)$
windowrule = workspace 2, class:^(brave-browser)$
windowrule = workspace 2, class:^(Brave-browser)$
windowrule = workspace 2, class:^(microsoft-edge)$
windowrule = workspace 2, class:^(Microsoft-edge)$

# Workspace 3: Microsoft (Teams & Outlook PWAs)
windowrule = workspace 3, class:^(chrome-cifhbcnohmdccbgoicgdjpfamggdegmo-Default)$  # Teams PWA
windowrule = workspace 3, class:^(chrome-faolnafnngnfdaknnbpnkhgohbobgegn-Default)$  # Outlook PWA

# Workspace 4: Music
windowrule = workspace 4, class:^(Spotify)$
windowrule = workspace 4, class:^(spotify)$

# Show applications on all workspaces (pin)
windowrule = pin, title:^(as_toolbar)$

# Transparency rules
windowrule = opacity 0.95, class:^(firefox)$

# Keybindings
$mainMod = SUPER

# 1. APPLICATIONS
bind = $mainMod, Return, exec, ghostty #"Terminal"
bind = $mainMod, E, exec, nautilus #"File Manager"
bind = $mainMod, B, exec, google-chrome-stable #"Browser"
bind = $mainMod, Y, exec, google-chrome-stable --profile-directory=Default --app-id=agimnkijcaahngcdmfeangaknmldooml #"YouTube Music"
bind = $mainMod, A, exec, google-chrome-stable --profile-directory=Default --app-id=cadlkienfkclaiaibeoongdcgmdikeeg #"ChatGPT"
bind = $mainMod SHIFT, G, exec, google-chrome-stable --profile-directory=Default --app-id=hnpfjngllnobngcgfapefoaidbinmjnm #"WhatsApp"
bind = $mainMod, Space, exec, noctalia-shell ipc call launcher toggle #"App Launcher"

# 2. WINDOW MANAGEMENT
bind = $mainMod, W, killactive, #"Close Window"
bind = $mainMod, F, togglefloating, #"Toggle Floating"
bind = $mainMod, M, fullscreen, #"Toggle Fullscreen"
bind = $mainMod SHIFT, Return, layoutmsg, swapwithmaster #"Swap with Master"
bind = $mainMod, O, layoutmsg, orientationcycle #"Cycle Orientation"
bind = $mainMod SHIFT, M, movetoworkspacesilent, special #"Move to Scratchpad"
bind = $mainMod SHIFT, P, togglespecialworkspace, #"Toggle Scratchpad"
bind = CTRL ALT, C, centerwindow, #"Center Window"
bind = CTRL ALT, Q, exit, #"Exit Hyprland"

# 3. NAVIGATION
bind = $mainMod, h, movefocus, l #"Focus Left"
bind = $mainMod, l, movefocus, r #"Focus Right"
bind = $mainMod, k, movefocus, u #"Focus Up"
bind = $mainMod, j, movefocus, d #"Focus Down"
bind = $mainMod SHIFT, left, resizeactive, -50 0 #"Shrink Width"
bind = $mainMod SHIFT, right, resizeactive, 50 0 #"Grow Width"
bind = $mainMod SHIFT, up, resizeactive, 0 -50 #"Shrink Height"
bind = $mainMod SHIFT, down, resizeactive, 0 50 #"Grow Height"

# 4. WORKSPACES
bind = $mainMod, 1, workspace, 1 #"Workspace 1"
bind = $mainMod, 2, workspace, 2 #"Workspace 2"
bind = $mainMod, 3, workspace, 3 #"Workspace 3"
bind = $mainMod, 4, workspace, 4 #"Workspace 4"
bind = $mainMod, 5, workspace, 5 #"Workspace 5"
bind = $mainMod, 6, workspace, 6 #"Workspace 6"
bind = $mainMod, 7, workspace, 7 #"Workspace 7"
bind = $mainMod, 8, workspace, 8 #"Workspace 8"
bind = $mainMod, 9, workspace, 9 #"Workspace 9"
bind = $mainMod, 0, workspace, 10 #"Workspace 10"
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Move to WS 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Move to WS 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Move to WS 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Move to WS 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Move to WS 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Move to WS 6"
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #"Move to WS 7"
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #"Move to WS 8"
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #"Move to WS 9"
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #"Move to WS 10"
bind = $mainMod, mouse_down, workspace, e+1 #"Next Workspace"
bind = $mainMod, mouse_up, workspace, e-1 #"Prev Workspace"

# 5. MOUSE
bindm = $mainMod, mouse:272, movewindow #"Move Window"
bindm = $mainMod, mouse:273, resizewindow #"Resize Window"

# 6. SCREENSHOTS & TOOLS
bind = $mainMod SHIFT, S, exec, ~/.local/bin/hyprshot -m region --raw | satty --filename - --output-filename ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png --copy-command wl-copy #"Screenshot Region"
bind = $mainMod CTRL, S, exec, ~/.local/bin/hyprshot -m window --raw | satty --filename - --output-filename ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png --copy-command wl-copy #"Screenshot Window"
bind = $mainMod SHIFT, R, exec, $HOME/.local/bin/screen-recorder #"Screen Recording"
bind = $mainMod SHIFT, C, exec, hyprpicker -a #"Color Picker"
bind = $mainMod SHIFT, W, exec, noctalia-shell ipc call wallpaper random #"Random Wallpaper"
bind = ALT SHIFT, 2, exec, $HOME/.local/bin/ocr #"OCR Text"
bind = ALT SHIFT, V, exec, ~/.config/fuzzel/fuzzel-clipboard.sh #"Clipboard History"

# 7. DISPLAY
bind = $mainMod, P, exec, ~/.local/bin/toggle-mirror #"Toggle Mirror Mode"
bind = $mainMod SHIFT, D, exec, systemctl --user restart hyprdynamicmonitors && notify-send "Monitor Configuration" "HyprDynamicMonitors reloaded" #"Reload Monitors"

# 8. SYSTEM
bind = CTRL ALT, L, exec, noctalia-shell ipc call lockScreen lock #"Lock Screen"
bind = $mainMod, N, exec, noctalia-shell ipc call notifications toggleHistory #"Notifications"
bind = $mainMod, slash, exec, noctalia-shell ipc call plugin:keybind-cheatsheet toggle #"Keybind Cheatsheet"

# 9. MEDIA KEYS
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10% #"Brightness Up"
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%- #"Brightness Down"
bind = SHIFT, XF86MonBrightnessUp, exec, brightnessctl -d tpacpi::kbd_backlight set +33% #"Kbd Backlight Up"
bind = SHIFT, XF86MonBrightnessDown, exec, brightnessctl -d tpacpi::kbd_backlight set 33%- #"Kbd Backlight Down"
bind = , XF86AudioRaiseVolume, exec, pamixer --increase 10 #"Volume Up"
bind = , XF86AudioLowerVolume, exec, pamixer --decrease 10 #"Volume Down"
bind = , XF86AudioMute, exec, pamixer --toggle-mute #"Toggle Mute"
bind = , XF86AudioMicMute, exec, pamixer --default-source --toggle-mute #"Toggle Mic Mute"
bind = SHIFT, XF86AudioRaiseVolume, exec, pamixer --increase 10 --default-source #"Mic Volume Up"
bind = SHIFT, XF86AudioLowerVolume, exec, pamixer --decrease 10 --default-source #"Mic Volume Down"

