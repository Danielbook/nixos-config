# Hyprlock Configuration
# Catppuccin Macchiato Theme with Lavender Accent

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# Background with blur
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(202, 211, 245, 1.0)  # Catppuccin text
    font_size = 120
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(165, 173, 203, 1.0)  # Catppuccin subtext0
    font_size = 24
    font_family = JetBrains Mono
    position = 0, 180
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(183, 189, 248, 1.0)  # Catppuccin lavender
    font_size = 28
    font_family = JetBrains Mono
    position = 0, 50
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(183, 189, 248, 1.0)  # Catppuccin lavender
    inner_color = rgba(54, 58, 79, 1.0)     # Catppuccin surface0
    font_color = rgba(202, 211, 245, 1.0)   # Catppuccin text
    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">Enter Password...</span>
    hide_input = false
    rounding = 8
    check_color = rgba(166, 218, 149, 1.0)  # Catppuccin green
    fail_color = rgba(237, 135, 150, 1.0)   # Catppuccin red
    fail_text = <span foreground="##ed8796">Authentication failed</span>
    fail_transition = 300
    capslock_color = rgba(245, 224, 220, 1.0)  # Catppuccin rosewater
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Keyboard layout indicator
label {
    monitor =
    text = $LAYOUT
    color = rgba(165, 173, 203, 1.0)  # Catppuccin subtext0
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -200
    halign = center
    valign = center
}
