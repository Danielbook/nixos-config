# Noctalia-generated tmux colors
# This file is processed by Noctalia's template engine to generate colors from wallpaper

# Status bar colors
set -g status-style "bg=default,fg={{colors.on_surface.default.hex}}"

# Left status
set -g status-left ""

# Window status formatting
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g window-status-current-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g window-status-separator " "

# Right status modules with icons
set -g status-right-length 200
set -g status-right "#[bg={{colors.tertiary.default.hex}},fg={{colors.on_tertiary.default.hex}}] 󰉋 #{b:pane_current_path} #[bg=default] #[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}]  #(whoami) #[bg=default] #[bg={{colors.secondary.default.hex}},fg={{colors.on_secondary.default.hex}}] 󰒋 #H #[bg=default] #[bg={{colors.tertiary_fixed_dim.default.hex}},fg={{colors.on_tertiary.default.hex}}]  #S #[bg=default] #[bg={{colors.primary_fixed_dim.default.hex}},fg={{colors.on_primary.default.hex}}] 󰃰 %Y-%m-%d %H:%M:%S "

# Pane borders
set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

# Pane border format
set -g pane-border-format " #[fg={{colors.primary.default.hex}}]#{pane_index}#[default] #{pane_title} "

# Message styling
set -g message-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-command-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"

# Mode (copy mode) styling
set -g mode-style "bg={{colors.tertiary.default.hex}},fg={{colors.on_tertiary.default.hex}}"

# Clock mode
set -g clock-mode-colour "{{colors.primary.default.hex}}"
