# THROWAWAY Stage F1c migration pod — NOT part of the real homeassistant
# stack. Mounts the empty ha-config iscsi PVC as a tar-stream target for
# jupiter's ./config (includes appdaemon/ and secrets.yaml). Delete after
# the restore is verified.
apiVersion: v1
kind: Pod
metadata:
  name: migrate-ha-config
  namespace: homeassistant
  labels:
    app: migrate-ha-config
spec:
  containers:
    - name: tar-target
      image: busybox:1.36
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: config
          mountPath: /mnt
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: ha-config
