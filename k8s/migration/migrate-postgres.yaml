# THROWAWAY Stage D0 migration pod — NOT part of the real immich stack. Mounts
# the empty immich-postgres iscsi PVC so pg_dump can stream into a real
# postgres instance before the D4 cutover. Delete after D0's data migration is
# verified; the real postgres Deployment (immich.yaml) starts fresh against
# this same PVC's data at D4.
apiVersion: v1
kind: Pod
metadata:
  name: migrate-postgres
  namespace: immich
  labels:
    app: migrate-postgres
spec:
  containers:
    - name: postgres
      image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 # confirmed via `docker inspect immich_postgres` on live tatooine
      envFrom:
        - secretRef:
            name: immich-postgres-env
      env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata # ext4 PVC root has lost+found; initdb needs an empty dir
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: immich-postgres
