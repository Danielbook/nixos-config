# THROWAWAY Stage F1c migration pod — NOT part of the real homeassistant
# stack. Mounts the empty matter-data iscsi PVC as a tar-stream target for
# jupiter's ./matter-data. Delete after the restore is verified.
apiVersion: v1
kind: Pod
metadata:
  name: migrate-matter-data
  namespace: homeassistant
  labels:
    app: migrate-matter-data
spec:
  containers:
    - name: tar-target
      image: busybox:1.36
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /mnt
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: matter-data
