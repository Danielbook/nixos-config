# mail-triage — local-LLM mail classification. See k8s/apps/mail-triage/mail-triage.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mail-triage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/apps/mail-triage
  destination:
    server: https://kubernetes.default.svc
    namespace: mail-triage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
