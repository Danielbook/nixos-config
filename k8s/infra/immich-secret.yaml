# immich DB/redis credentials, decrypted in-cluster by ksops. Same pipeline as
# k8s/infra/truenas-secret.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
