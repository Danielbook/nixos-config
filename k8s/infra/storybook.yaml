# storybook — db design system component explorer. See
# k8s/apps/storybook/storybook.yaml for details. The CHANGEME-SHA image tag
# there must be pinned to a CI-built sha before this can sync green.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storybook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/apps/storybook
  destination:
    server: https://kubernetes.default.svc
    namespace: storybook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
