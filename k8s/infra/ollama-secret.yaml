# open-webui authentik OAuth client credentials, decrypted in-cluster by
# ksops (same pipeline as immich-secret.yaml / arr-secret.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/ollama
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
