# forgejo-runner registration shared secret, decrypted in-cluster by ksops
# (same pipeline as ollama-secret.yaml). Server side registered via
# `forgejo-cli actions register --secret` — see k8s/apps/forgejo/runner.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/forgejo
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
