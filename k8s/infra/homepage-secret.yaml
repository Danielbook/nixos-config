# homepage widget API keys/tokens, decrypted in-cluster by ksops (same
# pipeline as immich-secret.yaml / arr-secret.yaml / navidrome-secret.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
