# mail-triage STT token + registry-pull secrets, decrypted in-cluster by ksops
# (same pipeline as fartlek-secret.yaml). See k8s/mail-triage/mail-triage-secrets.enc.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mail-triage-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/mail-triage
  destination:
    server: https://kubernetes.default.svc
    namespace: mail-triage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
