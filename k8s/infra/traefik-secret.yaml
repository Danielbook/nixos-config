# Cloudflare API token Secret (ksops) for Traefik's DNS-01 resolver. Separate
# from the Traefik Helm app because ksops decryption runs through kustomize, not
# Helm. Lands in the `traefik` ns; the Traefik pod crashloops until it exists,
# then recovers (same tolerance as the ksops chicken-and-egg in B5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
