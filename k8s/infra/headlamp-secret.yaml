# Headlamp OIDC secret — separate Argo Application from the workload (k8s/infra/headlamp.yaml),
# same two-Application split as monitoring/unifi/authentik.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/headlamp
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
