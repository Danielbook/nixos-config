# ntfy — push notifications. See k8s/apps/ntfy/ntfy.yaml for details.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/apps/ntfy
  destination:
    server: https://kubernetes.default.svc
    namespace: ntfy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
