# fartlek app/postgres/registry-pull secrets, decrypted in-cluster by ksops
# (same pipeline as forgejo-secret.yaml). See k8s/fartlek/fartlek-secrets.enc.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fartlek-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/fartlek
  destination:
    server: https://kubernetes.default.svc
    namespace: fartlek
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
