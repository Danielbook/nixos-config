# mealie OIDC client secret, decrypted in-cluster by ksops (same pipeline as
# immich-secret.yaml / arr-secret.yaml / navidrome-secret.yaml / homepage-secret.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mealie-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/mealie
  destination:
    server: https://kubernetes.default.svc
    namespace: mealie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
