# gluetun WireGuard credentials, decrypted in-cluster by ksops (same pipeline
# as immich-secret.yaml / traefik-secret.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/arr
  destination:
    server: https://kubernetes.default.svc
    namespace: arr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
