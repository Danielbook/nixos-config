# E3 smoke app (traefik/whoami). Plain-manifest directory source; its route is the
# `whoami` entry in k8s/infra/ingress.yaml. Tear down once E3 is verified, or keep
# as a permanent liveness canary.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/apps/whoami
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
