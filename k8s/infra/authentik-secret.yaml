# authentik env Secret, decrypted in-cluster by ksops. Same pipeline as
# k8s/infra/immich-secret.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
