# kube-prometheus-stack (Stage F1 monitoring migration) — replaces the legacy
# jupiter-scoped `telegraf` container (which only ever fed metrics for
# jupiter's own docker host) with cluster-wide metrics collection: Prometheus
# + node-exporter + kube-state-metrics across all 3 nodes (naboo, endor,
# tatooine). See docs/cluster-implementation.md. Lands in the `monitoring`
# namespace alongside Grafana/Loki (authored elsewhere) for simple in-cluster
# datasource DNS. The chart's bundled Grafana and Alertmanager are disabled —
# we already run our own Grafana in this namespace, and no alerting was
# requested for this migration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.10.1 # bump deliberately
    helm:
      valuesObject:
        grafana:
          enabled: false
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: iscsi
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
        prometheus-node-exporter:
          tolerations:
            # tatooine's GPU taint would otherwise exclude it from the
            # node-exporter daemonset (same pattern as democratic-csi-iscsi.yaml).
            # Verified against the chart's values.yaml (kube-prometheus-stack
            # 87.10.1): top-level `prometheus-node-exporter.tolerations` is the
            # node-exporter subchart's toleration key.
            - key: nvidia.com/gpu
              operator: Equal
              value: present
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
