# TrueNAS API credentials for democratic-csi (ksops-encrypted, decrypted
# in-cluster by the repo-server — same pattern as traefik-secret.yaml). Ships
# the two full driver-config Secrets the democratic-csi releases mount via
# existingConfigSecret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truenas-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/truenas
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
