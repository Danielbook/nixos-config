# monitoring env Secret (grafana admin password + authentik OAuth client),
# ksops-decrypted in-cluster — see k8s/apps/monitoring/monitoring.yaml for the workload.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
