# storybook registry-pull secret, decrypted in-cluster by ksops (same pipeline
# as fartlek-secret.yaml). See k8s/storybook/storybook-secrets.enc.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storybook-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/storybook
  destination:
    server: https://kubernetes.default.svc
    namespace: storybook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
