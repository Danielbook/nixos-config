# monitoring — Stage F1. influxdb + grafana, migrated from jupiter's
# grafana-stack docker-compose. See k8s/apps/monitoring/*.yaml for the workload
# and restore-ordering notes. telegraf and promtail are intentionally NOT part
# of this migration — telegraf is replaced by kube-prometheus-stack. Log
# aggregation (loki + a loki-alloy DaemonSet) was migrated in F1 and removed
# again: in 24 days it served 3.6M pushes and zero queries, while eating 5.2Gi
# of RAM on naboo and filling its 5Gi PVC. `kubectl logs` covers what we
# actually reach for.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.local.bookorjeman.com/danielbook/nixos-config.git
    targetRevision: main
    path: k8s/apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
