# navidrome last.fm credentials, decrypted in-cluster by ksops (same pipeline
# as immich-secret.yaml / arr-secret.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navidrome-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danielbook/nixos-config.git
    targetRevision: feat/cluster
    path: k8s/navidrome
  destination:
    server: https://kubernetes.default.svc
    namespace: navidrome
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
