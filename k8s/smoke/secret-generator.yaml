# KSOPS generator: repo-server decrypts each listed file via sops (using the
# mounted cluster age key) and emits the resulting manifest.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: ksops-smoke
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret.enc.yaml
