# Rendered once. Ported verbatim from jupiter's dynamic/config.yml +
# dynamic/authentik-forwardauth.yml. (jupiter's https-redirectscheme is dropped —
# http→https is handled natively at the Traefik web entrypoint, see k8s/infra/traefik.yaml.)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: default-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 15552000
    customFrameOptionsValue: SAMEORIGIN
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    address: {{ .Values.authentikAddress | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - Remote-User
      - Remote-Name
      - Remote-Email
