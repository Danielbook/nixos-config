{{- /* mkExternalRoute: one IngressRoute per .Values.externalRoutes entry,
       backed by a synthetic Service+Endpoints pointing at .url's IP (Traefik's
       IngressRoute CRD can't reference a bare URL directly, unlike jupiter's
       old file-provider dynamic config). */ -}}
{{- range .Values.externalRoutes }}
{{- $u := urlParse .url }}
{{- $hostParts := splitList ":" $u.host }}
{{- $port := ternary "443" "80" (eq $u.scheme "https") }}
{{- if gt (len $hostParts) 1 }}
{{- $port = index $hostParts 1 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  ports:
    - port: {{ $port }}
      targetPort: {{ $port }}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
subsets:
  - addresses:
      - ip: {{ $u.hostname }}
    ports:
      - port: {{ $port }}
{{- if .insecureSkipVerify }}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ .name }}-transport
  namespace: {{ $.Release.Namespace }}
spec:
  insecureSkipVerify: true
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .name }}.{{ $.Values.domain }}`)
      middlewares:
        - name: default-headers
        {{- if .auth }}
        - name: authentik-forwardauth
        {{- end }}
      services:
        - name: {{ .name }}
          namespace: {{ $.Release.Namespace }}
          port: {{ $port }}
          scheme: {{ $u.scheme }}
          {{- if .insecureSkipVerify }}
          serversTransport: {{ .name }}-transport
          {{- end }}
  tls: {}
{{- end }}
