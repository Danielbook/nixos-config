# KSOPS generator: repo-server decrypts cf-token.enc.yaml via sops (cluster age
# key) and emits the resulting Secret manifest.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: ksops-cloudflare-api-token
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./cf-token.enc.yaml
