# MetalLB adopted out of modules/nixos/services/metallb into GitOps (Stage E3).
# Same pinned upstream native manifest (v0.16.1) + identical pool CRs the Nix
# module shipped, so Argo re-applies a byte-identical install (adoption = no-op).
# Bump: change the tag below + keep it in sync with any future re-pin.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-native.yaml
  - pool.yaml
patches:
  - path: speaker-log-level.yaml
    target:
      kind: DaemonSet
      name: speaker
