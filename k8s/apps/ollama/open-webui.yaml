# open-webui — chat frontend for ollama (k8s/apps/ollama/ollama.yaml). Native
# authentik OIDC (client creds in the open-webui-oauth ksops secret, same
# pipeline as immich) instead of forward-auth — login form disabled, OIDC only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO data PVC — no rolling overlap
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          envFrom:
            - secretRef:
                name: open-webui-oauth
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: WEBUI_URL
              value: https://open-webui.local.bookorjeman.com
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OAUTH_SCOPES
              value: openid email profile
            - name: OPENID_PROVIDER_URL
              value: https://auth.local.bookorjeman.com/application/o/open-webui/.well-known/openid-configuration
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
