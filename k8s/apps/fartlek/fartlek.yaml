# fartlek — AI running coach (github.com/Danielbook/fartlek). Single Go image
# serving the JSON API + static SPA on 8080, built by Forgejo Actions CI and
# pushed to the in-cluster Forgejo registry. Per-app postgres on iscsi (RWO),
# same pattern as immich. Schema migrations run as an initContainer using the
# same image (golang-migrate wrapper baked in at /bin/migrate, SQL files at
# /migrations).
#
# The `fartlek-env` / `fartlek-postgres-env` / `fartlek-registry` Secrets
# (DB creds, Anthropic + Strava API keys, registry pull auth) are authored as
# ksops `k8s/fartlek/fartlek-secrets.enc.yaml`.
apiVersion: v1
kind: Namespace
metadata:
  name: fartlek
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fartlek-postgres
  namespace: fartlek
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fartlek-postgres
  namespace: fartlek
  labels:
    app: fartlek-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fartlek-postgres
  template:
    metadata:
      labels:
        app: fartlek-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: fartlek-postgres-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # ext4 PVC root has lost+found; initdb needs an empty dir
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fartlek-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: fartlek-postgres
  namespace: fartlek
spec:
  selector:
    app: fartlek-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fartlek
  namespace: fartlek
  labels:
    app: fartlek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fartlek
  template:
    metadata:
      labels:
        app: fartlek
    spec:
      imagePullSecrets:
        - name: fartlek-registry
      initContainers:
        # Schema migrations run before the server starts, from the same image
        # (custom golang-migrate wrapper; reads DATABASE_URL from env).
        - name: migrate
          image: forgejo.local.bookorjeman.com/daniel/fartlek:CHANGEME-SHA # pin to git sha from CI build; bump to deploy ("daniel" owner path is a placeholder too — confirm the Forgejo repo owner)
          command: ["/bin/migrate", "-path", "/migrations", "up"]
          envFrom:
            - secretRef:
                name: fartlek-env
      containers:
        - name: fartlek
          image: forgejo.local.bookorjeman.com/daniel/fartlek:CHANGEME-SHA # pin to git sha from CI build; bump to deploy ("daniel" owner path is a placeholder too — confirm the Forgejo repo owner)
          envFrom:
            - secretRef:
                name: fartlek-env
          env:
            - name: PORT
              value: "8080"
            - name: STRAVA_REDIRECT_URI
              value: https://fartlek.local.bookorjeman.com/auth/strava/callback
            - name: FRONTEND_URL
              value: https://fartlek.local.bookorjeman.com
            - name: ALLOWED_ORIGIN
              value: https://fartlek.local.bookorjeman.com
            - name: COOKIE_SECURE
              value: "true"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fartlek # mkRoute's .name drives both hostname and Service name — must be "fartlek"
  namespace: fartlek
spec:
  selector:
    app: fartlek
  ports:
    - port: 8080
      targetPort: 8080
