# seerr (ghcr.io/seerr-team/seerr — not jellyseerr) — no GPU, no NFS media
# mount (talks to jellyfin/*arr over HTTP).
# Config (SQLite db, settings) is the iscsi PVC below. NOT migrated from the
# old tatooine container — unlike jellyfin/immich, no migrate pod was ever
# run for seerr before the D1 wipe, so this PVC started empty (D3, 2026-07-04).
apiVersion: v1
kind: Namespace
metadata:
  name: seerr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: seerr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: seerr
  labels:
    app: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        fsGroup: 1000 # image runs as uid/gid 1000(node); iscsi PVC mounts root-owned otherwise
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.3.0 # not jellyseerr
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: seerr
  annotations:
    # dedicated LB IP so the guest WireGuard tunnel can be firewalled to
    # exactly this app — traefik's 10.10.40.51 fronts every service, so an
    # IP rule against it would grant guests the whole estate.
    metallb.io/loadBalancerIPs: 10.10.40.55
spec:
  type: LoadBalancer  # in addition to the ingress, which keeps using the ClusterIP
  selector:
    app: seerr
  ports:
    - port: 80
      targetPort: 5055
