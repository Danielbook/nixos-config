# authentik — postgres on iscsi (RWO, pg_dump'd in from jupiter's Docker
# Compose stack), media/custom-templates on a small nfs PVC (RWX, shared by
# server+worker). Redis is ephemeral cache, same reasoning as immich's.
#
# Source was jupiter (10.10.40.30): postgres:16-alpine, redis:alpine,
# goauthentik/server:2025.8 (server+worker). Tried bumping to `:latest`
# post-migration, but that tag actually resolved to 2025.2.4 — older than
# jupiter's source — and 500'd on every request because the restored DB
# already had the newer (2025.8+) schema. Pinned to 2025.8.4 instead (same
# version the servarr proxy-outpost was already running).
#
# Dropped vs jupiter's compose: the worker's /var/run/docker.sock mount (only
# used for authentik's Docker service-connection integration — no k8s
# equivalent, and mounting the host socket into a pod is unnecessary
# exposure). If authentik has a Docker service-connection configured, it'll
# show as a visible error in its admin UI post-migration — switch it to a
# Kubernetes service-connection instead.
#
# The standalone proxy-outpost container (ran separately on servarr because
# servarr was on a different network than jupiter) is also retired: once
# authentik lives in the cluster, Traefik reaches it directly over the
# cluster network, so the embedded outpost on authentik-server's own :9000
# covers forward-auth — see the Service named `auth` below and
# k8s/charts/ingress/values.yaml's authentikAddress.
#
# The `authentik-env` Secret (DB creds, AUTHENTIK_SECRET_KEY carried over
# verbatim from jupiter's secret_key.txt, email creds) is authored as ksops
# `k8s/authentik/authentik-env.enc.yaml`.
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-postgres
  namespace: authentik
  labels:
    app: authentik-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-postgres
  template:
    metadata:
      labels:
        app: authentik-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: authentik-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # ext4 PVC root has lost+found; initdb needs an empty dir
          resources:
            requests:
              memory: 128Mi
              cpu: 25m
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  selector:
    app: authentik-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: authentik
  labels:
    app: authentik-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-redis
  template:
    metadata:
      labels:
        app: authentik-redis
    spec:
      containers:
        - name: redis
          image: redis:8.8.0-alpine
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  selector:
    app: authentik-redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
  namespace: authentik
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
  labels:
    app: authentik-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2025.8.4 # :latest actually resolved to 2025.2.4 (older than jupiter's source 2025.8) — DB already has post-2025.8 schema, pin to a version at or above it instead
          args:
            - server
          envFrom:
            - secretRef:
                name: authentik-env
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: 512Mi
              cpu: 50m
          volumeMounts:
            - name: media
              mountPath: /media
              subPath: media
            - name: media
              mountPath: /templates
              subPath: custom-templates
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
---
apiVersion: v1
kind: Service
metadata:
  name: auth # drives the Host(auth.local.bookorjeman.com) route via mkRoute — must match the pre-existing hostname, see k8s/infra/ingress.yaml
  namespace: authentik
spec:
  selector:
    app: authentik-server
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
  labels:
    app: authentik-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/goauthentik/server:2025.8.4 # :latest actually resolved to 2025.2.4 (older than jupiter's source 2025.8) — DB already has post-2025.8 schema, pin to a version at or above it instead
          args:
            - worker
          envFrom:
            - secretRef:
                name: authentik-env
          resources:
            requests:
              memory: 512Mi
              cpu: 25m
          volumeMounts:
            - name: media
              mountPath: /media
              subPath: media
            - name: media
              mountPath: /templates
              subPath: custom-templates
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
