# grafana — Stage F1. Source was jupiter's grafana-stack docker-compose
# (grafana/grafana-enterprise:10.2.3, ran as user "1000:1000"). Starts at
# replicas 0 — dashboards/db restore lands first, same reasoning as influxdb
# (2026-07-08) — see docs/cluster-implementation.md Stage F1. Admin password +
# authentik OAuth client come from the ksops-decrypted grafana-env Secret
# (k8s/monitoring); everything else below is plain (non-secret) config, copied
# verbatim from jupiter's compose env.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-provisioning
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 0 # dashboards/db restore lands first — see comment above, docs/cluster-implementation.md Stage F1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: grafana
          image: grafana/grafana-enterprise:10.2.3
          envFrom:
            - secretRef:
                name: grafana-env
          env:
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.local.bookorjeman.com
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Authentik
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid profile email
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: https://auth.local.bookorjeman.com/application/o/authorize/
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: https://auth.local.bookorjeman.com/application/o/token/
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: https://auth.local.bookorjeman.com/application/o/userinfo/
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: preferred_username
            - name: GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH
              value: groups
            - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
              value: name
            - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
              value: email
            - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_OAUTH_AUTO_LOGIN
              value: "false"
            - name: GF_AUTH_OAUTH_SKIP_ORG_ROLE_UPDATE_SYNC
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_UPDATE_SYNC
              value: "false"
            - name: GF_AUTH_AUTO_ASSIGN_ORG
              value: "true"
            - name: GF_AUTH_AUTO_ASSIGN_ORG_ID
              value: "1"
            - name: GF_AUTH_AUTO_ASSIGN_ORG_ROLE
              value: Admin
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning # starts empty — dashboards/datasources tar-streamed in by a later migration step
          persistentVolumeClaim:
            claimName: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
