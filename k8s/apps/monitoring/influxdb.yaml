# influxdb — Stage F1. Source was jupiter's grafana-stack docker-compose
# (influxdb:2.7, bind mount ./influxdb -> /var/lib/influxdb2). Straight data-dir
# restore of an existing running instance (not a fresh-init container), so no
# env/secret is needed here. Data restored 2026-07-08 (6.9G tar-streamed from
# jupiter, size matches source) — bumped to replicas 1. jupiter's own influxdb
# container stopped (not removed), rollback path until Stage F2. See
# docs/cluster-implementation.md Stage F1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: monitoring
  labels:
    app: influxdb
spec:
  replicas: 1 # data restore verified 2026-07-08 — see comment above
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7
          ports:
            - containerPort: 8086
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: influxdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: monitoring
spec:
  selector:
    app: influxdb
  ports:
    - port: 8086
      targetPort: 8086
