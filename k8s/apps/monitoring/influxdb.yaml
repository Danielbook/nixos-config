# influxdb — Stage F1. Source was jupiter's grafana-stack docker-compose
# (influxdb:2.7, bind mount ./influxdb -> /var/lib/influxdb2). Straight data-dir
# restore of an existing running instance (not a fresh-init container), so no
# env/secret is needed here. Data restored 2026-07-08 (6.9G tar-streamed from
# jupiter, size matches source) — bumped to replicas 1. jupiter's own influxdb
# container stopped (not removed), rollback path until Stage F2. See
# docs/cluster-implementation.md Stage F1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: monitoring
  labels:
    app: influxdb
spec:
  replicas: 1 # data restore verified 2026-07-08 — see comment above
  # RWO iscsi PVC: RollingUpdate deadlocks when the replacement lands on a
  # different node -- it waits on a volume the old pod will not release.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          ports:
            - containerPort: 8086
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: influxdb-data
---
# Reached via Traefik ingress (influxdb.local.bookorjeman.com, see
# k8s/infra/ingress.yaml), not a dedicated LoadBalancer IP — OPNsense's
# telegraf reporting plugin and Home Assistant's InfluxDB integration (the two
# external LAN writers, Stage F1) both accept a hostname+HTTPS target, so no
# need to burn one of the small MetalLB pool's IPs the way unifi's device
# protocol required (Stage E5). No forward-auth on the route: these are
# machine writers authenticating with their own InfluxDB token, not browsers.
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: monitoring
spec:
  selector:
    app: influxdb
  ports:
    - port: 8086
      targetPort: 8086
