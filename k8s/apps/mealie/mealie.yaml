# mealie — migrated from jupiter's Docker Compose VM (10.10.40.30). OPENAI_API_KEY
# dropped here, but the v3.20 AI-provider migration copied the old value into
# the sqlite DB in plaintext. OIDC_CLIENT_SECRET rotated in Authentik +
# re-encrypted (issue #9) after the original leaked via an accidental cat of
# the source compose file mid-migration.
apiVersion: v1
kind: Namespace
metadata:
  name: mealie
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: mealie
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.20.1
          env:
            - name: ALLOW_SIGNUP
              value: "false"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Stockholm
            - name: SECURITY_MAX_LOGIN_ATTEMPTS
              value: "5"
            - name: MAX_WORKERS
              value: "1"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: BASE_URL
              value: https://mealie.local.bookorjeman.com
            - name: DB_ENGINE
              value: sqlite
            # No backup env vars here: SQLITE_BACKUP_ENABLED/FREQUENCY were
            # carried over from the compose file but exist nowhere in mealie
            # (v3.20.1), so they silently did nothing and the instance had zero
            # backups until 2026-08-04. mealie v3 registers six daily tasks and
            # none of them is a backup — it has no scheduled-backup feature at
            # all. The mealie-backup CronJob below drives the API instead.
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_SIGNUP_ENABLED
              value: "false"
            - name: OIDC_CONFIGURATION_URL
              value: https://auth.local.bookorjeman.com/application/o/mealie/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: i38EuNvUIUkgA1fEKhgQlnTiUjIndIrZJuN6nQGR
            # AI config is NOT here. Mealie v3.20 migration 2187537c52b8 moved
            # OPENAI_* env into the DB (ai_providers table, per group); env is
            # read once at migration and ignored after. Edit via UI:
            # group settings -> AI Providers. Currently ollama + qwen2.5:7b.
          envFrom:
            - secretRef:
                name: mealie-env
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /app/data
          startupProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mealie-backup
  namespace: mealie
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: curlimages/curl:8.11.1
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mealie-env
                      key: MEALIE_API_TOKEN
              # backups land in /app/data/backups on the iscsi PVC, which the
              # TrueNAS ZFS snapshot then carries off — a logical export inside
              # a block snapshot, unlike snapshotting the live sqlite file
              # alone. mealie never prunes, so keep the newest 14 (~25 MB each).
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  API=http://mealie.mealie.svc.cluster.local/api
                  auth="Authorization: Bearer $TOKEN"
                  echo "creating backup"
                  code=$(curl -sS -o /tmp/new.json -w '%{http_code}' \
                    -X POST -H "$auth" "$API/admin/backups")
                  test "$code" = "201" || { echo "backup failed: HTTP $code"; cat /tmp/new.json; exit 1; }
                  curl -sS -H "$auth" "$API/admin/backups" > /tmp/list.json
                  total=$(tr ',' '\n' < /tmp/list.json | grep -c '"name"' || true)
                  echo "backup created; $total on disk"
                  # names sort chronologically (mealie_v3.20.1_YYYY.MM.DD.HH.MM.SS.zip);
                  # reverse-sort + tail keeps the newest 14 (POSIX — busybox
                  # takes 'head -n -14' but BSD head does not, so avoid it)
                  tr ',' '\n' < /tmp/list.json \
                    | sed -n 's/.*"name":"\([^"]*\)".*/\1/p' \
                    | sort -r | tail -n +15 \
                    | while read -r old; do
                        echo "pruning $old"
                        curl -sS -X DELETE -H "$auth" "$API/admin/backups/$old" >/dev/null
                      done
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
spec:
  selector:
    app: mealie
  ports:
    - port: 80
      targetPort: 9000
