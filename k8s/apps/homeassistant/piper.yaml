# piper — local Swedish TTS for HA over the Wyoming protocol. Add it in HA
# as a Wyoming integration with host piper.homeassistant.svc.cluster.local,
# port 10200. CPU only, the GPU on tatooine is full.
# ponytail: emptyDir, the voice (~60 MB) downloads again on each restart.
# Use a PVC if the restarts or the download become a problem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  namespace: homeassistant
  labels:
    app: piper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piper
  template:
    metadata:
      labels:
        app: piper
    spec:
      containers:
        - name: piper
          image: rhasspy/wyoming-piper:2.5.2
          args: ["--voice", "sv_SE-nst-medium"]
          ports:
            - containerPort: 10200
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: piper
  namespace: homeassistant
spec:
  selector:
    app: piper
  ports:
    - port: 10200
