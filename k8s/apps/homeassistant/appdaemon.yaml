# appdaemon — Stage F1c. Source: acockburn/appdaemon:latest on jupiter,
# resolved 4.5.13. Shares the ha-config PVC (subPath appdaemon -> /conf, same
# dir HA writes to) rather than a separate volume. HA_URL uses the in-cluster
# Service (homeassistant is hostNetwork but still gets a normal ClusterIP
# Service). TOKEN comes from the ksops appdaemon-env Secret — post-restore,
# config/appdaemon/appdaemon.yaml's hardcoded token + ha_url must be swapped
# for `!env_var TOKEN` / `!env_var HA_URL` (see docs/cluster-implementation.md
# Stage F1c). Also post-restore: the MQTT plugin block's `client_host:
# localhost` relied on jupiter's network_mode: host (mosquitto shared the
# same host localhost) — this pod is NOT hostNetwork, so client_host must
# change to `mosquitto` or MQTT-namespace automations silently stop firing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appdaemon
  namespace: homeassistant
  labels:
    app: appdaemon
spec:
  replicas: 1 # data restored, !env_var + client_host: mosquitto applied 2026-07-08 (Stage F1c)
  selector:
    matchLabels:
      app: appdaemon
  template:
    metadata:
      labels:
        app: appdaemon
    spec:
      nodeSelector:
        kubernetes.io/hostname: naboo # shares homeassistant's RWO ha-config PVC — iscsi can't attach to two nodes at once
      containers:
        - name: appdaemon
          image: acockburn/appdaemon:4.5.13
          envFrom:
            - secretRef:
                name: appdaemon-env
          env:
            - name: HA_URL
              value: http://homeassistant:8123
            - name: DASH_URL
              value: http://0.0.0.0:5050 # appdaemon's http.url is a BIND addr, not a display link — Service ClusterIP isn't a local iface
          volumeMounts:
            - name: config
              mountPath: /conf
              subPath: appdaemon
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ha-config
---
apiVersion: v1
kind: Service
metadata:
  name: appdaemon
  namespace: homeassistant
spec:
  selector:
    app: appdaemon
  ports:
    - port: 5050
