# mosquitto — Stage F1c. Source: eclipse-mosquitto:2 on jupiter, resolved
# 2.1.2. mosquitto.conf has no password_file (allow_anonymous true) so it's a
# plain ConfigMap, not a secret. Service is LoadBalancer on a dedicated
# MetalLB IP (raw TCP, can't ride Traefik's Host-header routing — same
# reasoning as unifi's .52).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: homeassistant
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: homeassistant
  labels:
    app: mosquitto
spec:
  replicas: 0 # bump once mosquitto-data PVC restored
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: homeassistant
  annotations:
    metallb.io/loadBalancerIPs: 10.10.40.53
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - port: 1883
