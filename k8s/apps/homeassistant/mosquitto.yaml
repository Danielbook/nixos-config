# mosquitto — Stage F1c. Source: eclipse-mosquitto:2 on jupiter, resolved
# 2.1.2. Auth required since issue #7: password_file from the mosquitto-creds
# ksops Secret (k8s/apps/homeassistant/mosquitto-creds.enc.yaml), anonymous
# refused. Service is LoadBalancer on a dedicated MetalLB IP (raw TCP, can't
# ride Traefik's Host-header routing — same reasoning as unifi's .52).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: homeassistant
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    password_file /mosquitto/config/passwd
    persistence true
    persistence_location /mosquitto/data/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: homeassistant
  labels:
    app: mosquitto
spec:
  replicas: 1 # data restored + verified 2026-07-08 (Stage F1c)
  strategy:
    type: Recreate # RWO iscsi PVC — RollingUpdate deadlocks on Multi-Attach
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine@sha256:847b8594cd4928734bda3c5daad42fea5c79de50d87a568798552e60eea2e970 # tag for Renovate, digest locks the image
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: passwd
              mountPath: /mosquitto/config/passwd
              subPath: passwd
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: passwd
          secret:
            secretName: mosquitto-creds
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: homeassistant
  annotations:
    metallb.io/loadBalancerIPs: 10.10.40.53
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - port: 1883
