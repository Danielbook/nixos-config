# Prototype C: Bubble Card, mobile first. One home screen. Each room is a
# pop-up (opened by #hash). The footer bar is the room navigation.
title: Home (bubble)
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Home
            icon: mdi:home-heart
            sub_button:
              - {entity: sensor.outside_temperature, icon: mdi:thermometer, state_content: state, show_background: false}
              - {entity: sensor.nord_pool_se3_aktuellt_pris, icon: mdi:flash, state_content: state, show_background: false}
          - &person
            type: custom:bubble-card
            card_type: button
            button_type: state
            entity: person.daniel_book
            name: Daniel
            grid_options: {columns: 6}
          - <<: *person
            entity: person.johanna_orjeman
            name: Johanna
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: alarm_control_panel.alarmo
            name: Alarm
            icon: mdi:shield-home
            grid_options: {columns: 12}
            sub_button:
              - {name: Home, icon: mdi:shield-home, tap_action: {action: perform-action, perform_action: script.alarm_arm_home}}
              - {name: Away, icon: mdi:shield-lock, tap_action: {action: perform-action, perform_action: script.alarm_arm_away}}
              - {name: Off, icon: mdi:shield-off, tap_action: {action: perform-action, perform_action: script.alarm_disarm}}
          - type: custom:bubble-card
            card_type: cover
            entity: cover.garage_door
            name: Garage
            icon_open: mdi:garage-open
            icon_close: mdi:garage
            grid_options: {columns: 12}
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.count_lights_on
            name: Lights on
            icon: mdi:lightbulb-group
            grid_options: {columns: 12}
            sub_button:
              - name: All off
                icon: mdi:lightbulb-off
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.all_lights_off
                  confirmation: {text: Turn off all lights?}
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Rooms
            icon: mdi:floor-plan
          - &room
            type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: light.living_room_group
            name: Living room
            icon: mdi:sofa
            card_layout: large
            grid_options: {columns: 6}
            button_action: {tap_action: {action: navigate, navigation_path: '#living-room'}}
            tap_action: {action: toggle}
          - <<: *room
            entity: light.kitchen_group
            name: Kitchen
            icon: mdi:silverware-fork-knife
            button_action: {tap_action: {action: navigate, navigation_path: '#kitchen'}}
          - <<: *room
            entity: light.bedroom_group
            name: Bedroom
            icon: mdi:bed-king
            button_action: {tap_action: {action: navigate, navigation_path: '#bedroom'}}
          - <<: *room
            entity: light.bathroom_group
            name: Bathroom
            icon: mdi:shower
            button_action: {tap_action: {action: navigate, navigation_path: '#bathroom'}}
          - <<: *room
            entity: light.hallway_group
            name: Hallway
            icon: mdi:door
            button_action: {tap_action: {action: navigate, navigation_path: '#hallway'}}
          - <<: *room
            entity: light.lyras_room_group
            name: Lyra & Luna
            icon: mdi:teddy-bear
            button_action: {tap_action: {action: navigate, navigation_path: '#kids'}}
          - <<: *room
            entity: light.gym_group
            name: Gym
            icon: mdi:dumbbell
            button_action: {tap_action: {action: navigate, navigation_path: '#gym'}}
          - <<: *room
            entity: light.outside_group
            name: Outside
            icon: mdi:tree
            button_action: {tap_action: {action: navigate, navigation_path: '#outside'}}
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Climate & media
            icon: mdi:heat-pump
          - &state
            type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.f1255_12_cu_varmvatten_topp_bt7_40013
            name: Hot water
            icon: mdi:water-boiler
            grid_options: {columns: 6}
          - <<: *state
            entity: sensor.f1255_12_cu_gradminuter_40941
            name: Degree min
            icon: mdi:heat-pump
          - type: custom:bubble-card
            card_type: climate
            entity: climate.kylskap_fridge
            name: Fridge
            grid_options: {columns: 12}
          - <<: *state
            entity: sensor.axensvagen_13_laddstatus
            name: EV charger
            icon: mdi:ev-station
          - <<: *state
            entity: vacuum.sky
            name: Sky
            icon: mdi:robot-vacuum
          - &mp
            type: custom:bubble-card
            card_type: media-player
            entity: media_player.tv_living_room
            name: TV
            grid_options: {columns: 12}
          - <<: *mp
            entity: media_player.spotify_daniel_book
            name: Spotify

          # Pop-ups. Each stays hidden until a card navigates to its #hash.
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#living-room'
            name: Living room
            icon: mdi:sofa
            entity: light.living_room_group
            button_type: slider
            sub_button:
              - {entity: sensor.living_room_temperature, state_content: state, show_background: false}
            cards:
              - &slider
                type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: light.living_room_ambient_group
                name: Ambient
              - <<: *slider
                entity: light.living_room_window_group
                name: Windows
              - <<: *slider
                entity: light.living_room_couch_led
                name: Couch LED
              - <<: *slider
                entity: light.living_room_tv_led
                name: TV LED
              - <<: *slider
                entity: light.living_room_mushroom_group
                name: Mushroom
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Colourful scene
                icon: mdi:palette
                button_action: {tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.living_room_colourful}}}
              - <<: *mp
                entity: media_player.denon_avr_1912
                name: Receiver
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#kitchen'
            name: Kitchen
            icon: mdi:silverware-fork-knife
            entity: light.kitchen_group
            button_type: slider
            cards:
              - <<: *slider
                entity: light.kitchen_island
                name: Island
              - <<: *slider
                entity: light.kitchen_bench
                name: Bench
              - <<: *slider
                entity: light.kitchen_ceiling
                name: Ceiling
              - <<: *slider
                entity: light.kitchen_table
                name: Table
              - <<: *slider
                entity: light.kitchen_window_group
                name: Windows
              - <<: *slider
                entity: light.kitchen_display_cabinet
                name: Cabinet
              - {type: custom:bubble-card, card_type: climate, entity: climate.kylskap_freezer, name: Freezer}
              - {type: custom:bubble-card, card_type: button, entity: switch.kitchen_dishwasher, name: Dishwasher}
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#bedroom'
            name: Bedroom
            icon: mdi:bed-king
            entity: light.bedroom_group
            button_type: slider
            sub_button:
              - {entity: sensor.bedroom_smoke_sensor_temperature, state_content: state, show_background: false}
            cards:
              - <<: *slider
                entity: light.bedroom_daniel
                name: Daniel
              - <<: *slider
                entity: light.bedroom_johanna
                name: Johanna
              - <<: *slider
                entity: light.bedroom_window
                name: Window
              - {type: custom:bubble-card, card_type: button, entity: switch.adaptive_lighting_sleep_mode_bedroom, name: Sleep mode, icon: mdi:sleep}
              - {type: custom:bubble-card, card_type: button, entity: input_boolean.alarm_clock, name: Alarm clock, icon: mdi:alarm}
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#bathroom'
            name: Bathroom
            icon: mdi:shower
            entity: light.bathroom_group
            button_type: slider
            cards:
              - <<: *slider
                entity: light.bathroom_ceiling_group
                name: Ceiling
              - {type: custom:bubble-card, card_type: button, entity: input_boolean.shower_mode, name: Shower mode, icon: mdi:shower-head}
              - <<: *slider
                entity: light.basement_bathroom_group
                name: Basement bathroom
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#hallway'
            name: Hallway
            icon: mdi:door
            entity: light.hallway_group
            button_type: slider
            cards:
              - {type: custom:bubble-card, card_type: button, button_type: state, entity: binary_sensor.hallway_door_contact, name: Front door}
              - {type: custom:bubble-card, card_type: button, button_type: state, entity: binary_sensor.hallway_motion_sensor_occupancy, name: Motion}
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#kids'
            name: Lyra & Luna
            icon: mdi:teddy-bear
            cards:
              - {type: custom:bubble-card, card_type: separator, name: Lyra}
              - <<: *slider
                entity: light.lyras_room_group
                name: All
              - <<: *slider
                entity: light.lyras_room_bed
                name: Bed
              - {type: custom:bubble-card, card_type: separator, name: Luna}
              - <<: *slider
                entity: light.lunas_room_group
                name: All
              - <<: *slider
                entity: light.lunas_room_bed
                name: Bed
              - <<: *slider
                entity: light.lunas_room_reading_corner
                name: Reading corner
              - <<: *mp
                entity: media_player.lunas_rum
                name: Speaker
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#gym'
            name: Gym
            icon: mdi:dumbbell
            entity: light.gym_group
            button_type: slider
            sub_button:
              - {entity: sensor.everything_presence_one_709ac8_temperature, state_content: state, show_background: false}
            cards:
              - <<: *slider
                entity: light.gym_desk_wled
                name: Desk WLED
              - <<: *slider
                entity: light.gym_led
                name: LED
              - {type: custom:bubble-card, card_type: separator, name: 3D printer, icon: mdi:printer-3d}
              - {type: picture-entity, entity: camera.octoprint_camera, show_name: false}
              - {type: custom:bubble-card, card_type: button, button_type: state, entity: sensor.octoprint_job_percentage, name: Progress, icon: mdi:printer-3d-nozzle}
              - {type: custom:bubble-card, card_type: button, entity: switch.prusa_mk3s, name: Printer power}
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#outside'
            name: Outside
            icon: mdi:tree
            entity: light.outside_group
            button_type: slider
            cards:
              - <<: *slider
                entity: light.outside_wall
                name: Wall
              - <<: *slider
                entity: light.outside_balcony_group
                name: Balcony
              - {type: weather-forecast, entity: weather.smhi_home, forecast_type: hourly}

          # Must stay the last card in the view (Bubble Card requirement).
          - type: custom:bubble-card
            card_type: horizontal-buttons-stack
            auto_order: true
            1_name: Living
            1_icon: mdi:sofa
            1_link: '#living-room'
            1_entity: light.living_room_group
            1_pir_sensor: light.living_room_group
            2_name: Kitchen
            2_icon: mdi:silverware-fork-knife
            2_link: '#kitchen'
            2_entity: light.kitchen_group
            2_pir_sensor: binary_sensor.presence_kitchen
            3_name: Bedroom
            3_icon: mdi:bed-king
            3_link: '#bedroom'
            3_entity: light.bedroom_group
            3_pir_sensor: light.bedroom_group
            4_name: Bathroom
            4_icon: mdi:shower
            4_link: '#bathroom'
            4_entity: light.bathroom_group
            4_pir_sensor: binary_sensor.bathroom_motion_sensor_occupancy
            5_name: Hallway
            5_icon: mdi:door
            5_link: '#hallway'
            5_entity: light.hallway_group
            5_pir_sensor: binary_sensor.hallway_motion_sensor_occupancy
            6_name: Kids
            6_icon: mdi:teddy-bear
            6_link: '#kids'
            6_entity: light.lyras_room_group
            6_pir_sensor: light.lyras_room_group
            7_name: Gym
            7_icon: mdi:dumbbell
            7_link: '#gym'
            7_entity: light.gym_group
            7_pir_sensor: binary_sensor.everything_presence_one_709ac8_occupancy
            8_name: Outside
            8_icon: mdi:tree
            8_link: '#outside'
            8_entity: light.outside_group
            8_pir_sensor: light.outside_group
