# Prototype A: native sections view, tile and heading cards only (no HACS).
title: Home (native)
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    badges:
      - type: entity
        entity: person.daniel_book
        show_entity_picture: true
      - type: entity
        entity: person.johanna_orjeman
        show_entity_picture: true
      - type: entity
        entity: sensor.outside_temperature
        color: light-blue
      - type: entity
        entity: sensor.nord_pool_se3_aktuellt_pris
        icon: mdi:flash
        color: amber
      - type: entity
        entity: sensor.count_lights_on
        icon: mdi:lightbulb-group
        color: yellow
        tap_action:
          action: perform-action
          perform_action: script.all_lights_off
          confirmation:
            text: Turn off all lights?
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            icon: mdi:home-heart
          - type: weather-forecast
            entity: weather.smhi_home
            forecast_type: daily
            show_forecast: true
            grid_options:
              columns: 12
          - type: tile
            entity: alarm_control_panel.alarmo
            name: Alarm
            features:
              - type: alarm-modes
                modes: [armed_home, armed_away, disarmed]
            grid_options:
              columns: 12
          - type: tile
            entity: cover.garage_door
            name: Garage
            features:
              - type: cover-open-close
          - type: tile
            entity: vacuum.sky
            name: Sky
            features:
              - type: vacuum-commands
                commands: [start_pause, return_home]
      - type: grid
        cards:
          - type: heading
            heading: Rooms
            icon: mdi:floor-plan
          - &room
            type: tile
            entity: light.living_room_group
            name: Living room
            icon: mdi:sofa
            tap_action: {action: navigate, navigation_path: /dash-native/living-room}
            icon_tap_action: {action: toggle}
            vertical: true
          - <<: *room
            entity: light.kitchen_group
            name: Kitchen
            icon: mdi:silverware-fork-knife
            tap_action: {action: navigate, navigation_path: /dash-native/kitchen}
          - <<: *room
            entity: light.bedroom_group
            name: Bedroom
            icon: mdi:bed-king
            tap_action: {action: navigate, navigation_path: /dash-native/bedroom}
          - <<: *room
            entity: light.bathroom_group
            name: Bathroom
            icon: mdi:shower
            tap_action: {action: navigate, navigation_path: /dash-native/bathroom}
          - <<: *room
            entity: light.hallway_group
            name: Hallway
            icon: mdi:door
            tap_action: {action: navigate, navigation_path: /dash-native/hallway}
          - <<: *room
            entity: light.lyras_room_group
            name: Lyra
            icon: mdi:teddy-bear
            tap_action: {action: navigate, navigation_path: /dash-native/lyra}
          - <<: *room
            entity: light.lunas_room_group
            name: Luna
            icon: mdi:star-face
            tap_action: {action: navigate, navigation_path: /dash-native/luna}
          - <<: *room
            entity: light.gym_group
            name: Gym
            icon: mdi:dumbbell
            tap_action: {action: navigate, navigation_path: /dash-native/gym}
          - <<: *room
            entity: light.basement_bathroom_group
            name: Basement bath
            icon: mdi:bathtub
            tap_action: {action: navigate, navigation_path: /dash-native/basement-bathroom}
          - <<: *room
            entity: light.outside_group
            name: Outside
            icon: mdi:tree
            tap_action: {action: navigate, navigation_path: /dash-native/outside}
      - type: grid
        cards:
          - type: heading
            heading: Climate & energy
            icon: mdi:thermometer
          - type: tile
            entity: sensor.f1255_12_cu_varmvatten_topp_bt7_40013
            name: Hot water
            icon: mdi:water-boiler
            color: deep-orange
          - type: tile
            entity: sensor.f1255_12_cu_gradminuter_40941
            name: Degree minutes
            icon: mdi:heat-pump
          - type: tile
            entity: climate.kylskap_fridge
            name: Fridge
          - type: tile
            entity: climate.kylskap_freezer
            name: Freezer
          - type: tile
            entity: sensor.axensvagen_13_laddstatus
            name: EV charger
            icon: mdi:ev-station
          - type: tile
            entity: sensor.laundry_room_laundry_machine_power
            name: Washer
            icon: mdi:washing-machine
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.nord_pool_se3_aktuellt_pris
                name: Price
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: Media
            icon: mdi:speaker
          - type: tile
            entity: media_player.tv_living_room
            name: TV
            grid_options: {columns: 12}
          - type: tile
            entity: media_player.denon_avr_1912
            name: Receiver
          - type: tile
            entity: media_player.spotify_daniel_book
            name: Spotify

  # Room subviews. Opened from the Rooms section, back arrow returns home.
  - title: Living room
    path: living-room
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lights
            badges:
              - type: entity
                entity: sensor.living_room_temperature
              - type: entity
                entity: binary_sensor.living_room_door_contact
          - &light
            type: tile
            entity: light.living_room_group
            name: All
            features: [{type: light-brightness}]
            grid_options: {columns: 12}
          - {type: tile, entity: light.living_room_ambient_group, name: Ambient}
          - {type: tile, entity: light.living_room_window_group, name: Windows}
          - {type: tile, entity: light.living_room_couch_led, name: Couch LED}
          - {type: tile, entity: light.living_room_tv_led, name: TV LED}
          - {type: tile, entity: light.living_room_mushroom_group, name: Mushroom}
          - {type: tile, entity: scene.living_room_colourful, name: Colourful}
      - type: grid
        cards:
          - {type: heading, heading: Media & cleaning}
          - {type: media-control, entity: media_player.tv_living_room, grid_options: {columns: 12}}
          - {type: tile, entity: media_player.denon_avr_1912, name: Receiver, features: [{type: media-player-volume-slider}], grid_options: {columns: 12}}
          - {type: tile, entity: vacuum.sky, features: [{type: vacuum-commands, commands: [start_pause, stop, return_home, locate]}], grid_options: {columns: 12}}

  - title: Kitchen
    path: kitchen
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lights
            badges:
              - {type: entity, entity: binary_sensor.presence_kitchen}
          - <<: *light
            entity: light.kitchen_group
          - {type: tile, entity: light.kitchen_island, name: Island}
          - {type: tile, entity: light.kitchen_bench, name: Bench}
          - {type: tile, entity: light.kitchen_ceiling, name: Ceiling}
          - {type: tile, entity: light.kitchen_table, name: Table}
          - {type: tile, entity: light.kitchen_window_group, name: Windows}
          - {type: tile, entity: light.kitchen_display_cabinet, name: Cabinet}
      - type: grid
        cards:
          - type: heading
            heading: Appliances
            badges:
              - {type: entity, entity: binary_sensor.kylskap_door_open}
          - {type: tile, entity: climate.kylskap_fridge, name: Fridge, features: [{type: target-temperature}]}
          - {type: tile, entity: climate.kylskap_freezer, name: Freezer, features: [{type: target-temperature}]}
          - {type: tile, entity: switch.kitchen_dishwasher, name: Dishwasher}
          - {type: tile, entity: sensor.kitchen_dishwasher_power, name: Dishwasher power}
          - {type: tile, entity: media_player.kok, name: Speaker, grid_options: {columns: 12}}

  - title: Bedroom
    path: bedroom
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lights
            badges:
              - {type: entity, entity: sensor.bedroom_smoke_sensor_temperature}
              - {type: entity, entity: binary_sensor.bedroom_smoke_sensor_smoke}
          - <<: *light
            entity: light.bedroom_group
          - {type: tile, entity: light.bedroom_daniel, name: Daniel}
          - {type: tile, entity: light.bedroom_johanna, name: Johanna}
          - {type: tile, entity: light.bedroom_window, name: Window}
          - {type: tile, entity: switch.adaptive_lighting_sleep_mode_bedroom, name: Sleep mode, icon: mdi:sleep}
      - type: grid
        cards:
          - {type: heading, heading: Morning}
          - {type: tile, entity: input_boolean.alarm_clock, name: Alarm clock, icon: mdi:alarm}
          - {type: tile, entity: input_boolean.wake_up_light, name: Wake-up light, icon: mdi:weather-sunset-up}

  - title: Bathroom
    path: bathroom
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bathroom
            badges:
              - {type: entity, entity: sensor.bathroom_motion_sensor_temperature}
              - {type: entity, entity: binary_sensor.bathroom_motion_sensor_occupancy}
          - <<: *light
            entity: light.bathroom_group
          - {type: tile, entity: light.bathroom_ceiling_group, name: Ceiling}
          - {type: tile, entity: input_boolean.shower_mode, name: Shower mode, icon: mdi:shower-head}

  - title: Hallway
    path: hallway
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Hallway
            badges:
              - {type: entity, entity: sensor.hallway_motion_sensor_temperature}
              - {type: entity, entity: binary_sensor.hallway_motion_sensor_occupancy}
          - <<: *light
            entity: light.hallway_group
          - {type: tile, entity: binary_sensor.hallway_door_contact, name: Front door}

  - title: Lyra
    path: lyra
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lyra's room
            badges:
              - {type: entity, entity: sensor.lyras_room_smoke_detector_temperature}
              - {type: entity, entity: binary_sensor.lyras_room_smoke_detector_smoke}
          - <<: *light
            entity: light.lyras_room_group
          - {type: tile, entity: light.lyras_room_bed, name: Bed}

  - title: Luna
    path: luna
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Luna's room
            badges:
              - {type: entity, entity: binary_sensor.lunas_room_smoke_sensor_smoke}
          - <<: *light
            entity: light.lunas_room_group
          - {type: tile, entity: light.lunas_room_bed, name: Bed}
          - {type: tile, entity: light.lunas_room_window_light, name: Window}
          - {type: tile, entity: light.lunas_room_reading_corner, name: Reading corner}
          - {type: tile, entity: media_player.lunas_rum, name: Speaker, grid_options: {columns: 12}}

  - title: Gym
    path: gym
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Gym
            badges:
              - {type: entity, entity: sensor.everything_presence_one_709ac8_temperature}
              - {type: entity, entity: sensor.everything_presence_one_709ac8_humidity}
              - {type: entity, entity: binary_sensor.everything_presence_one_709ac8_occupancy}
          - <<: *light
            entity: light.gym_group
          - {type: tile, entity: light.gym_desk_wled, name: Desk WLED}
          - {type: tile, entity: light.gym_led, name: LED}
      - type: grid
        cards:
          - {type: heading, heading: 3D printer}
          - {type: picture-entity, entity: camera.octoprint_camera, show_name: false, grid_options: {columns: 12}}
          - {type: tile, entity: sensor.octoprint_job_percentage, name: Progress, icon: mdi:printer-3d-nozzle}
          - {type: tile, entity: switch.prusa_mk3s, name: Printer power}
          - {type: tile, entity: switch.n4_server, name: N4 server, icon: mdi:server}

  - title: Basement bathroom
    path: basement-bathroom
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Basement bathroom
            badges:
              - {type: entity, entity: binary_sensor.basement_bathroom_motion_sensor_occupancy}
          - <<: *light
            entity: light.basement_bathroom_group
          - {type: tile, entity: switch.laundry_room_laundry_machine, name: Washer}
          - {type: tile, entity: sensor.laundry_room_laundry_machine_power, name: Washer power}

  - title: Outside
    path: outside
    subview: true
    back_path: /dash-native/home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Outside
            badges:
              - {type: entity, entity: sensor.outside_temperature}
          - <<: *light
            entity: light.outside_group
          - {type: tile, entity: light.outside_wall, name: Wall}
          - {type: tile, entity: light.outside_balcony_group, name: Balcony}
          - {type: tile, entity: cover.garage_door, name: Garage, features: [{type: cover-open-close}], grid_options: {columns: 12}}
