# Argo CD renders only the files in this list. Add each new manifest here.
# The ksops generator decrypts the *.enc.yaml Secrets in-cluster (ADR-0001).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - appdaemon.yaml
  - esphome.yaml
  - homeassistant.yaml
  - matter-server.yaml
  - mosquitto.yaml
  - music-assistant.yaml
  - namespace.yaml
  - zigbee2mqtt.yaml
generators:
  - secret-generator.yaml
