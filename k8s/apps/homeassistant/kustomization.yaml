# Argo CD renders only the files in this list. Add each new manifest here.
# The ksops generator decrypts the *.enc.yaml Secrets in-cluster (ADR-0001).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - appdaemon.yaml
  - esphome.yaml
  - homeassistant.yaml
  - matter-server.yaml
  - mosquitto.yaml
  - music-assistant.yaml
  - namespace.yaml
  - zigbee2mqtt.yaml
generators:
  - secret-generator.yaml
# YAML-mode Lovelace dashboards, mounted at /config/dashboards. No hash
# suffix, so the kubelet updates the files in place and HA does not restart.
configMapGenerator:
  - name: ha-dashboards
    namespace: homeassistant
    files:
      - dashboards/native.yaml
      - dashboards/mushroom.yaml
      - dashboards/bubble.yaml
      - dashboards/glass.yaml
    options:
      disableNameSuffixHash: true
  # The home-panel card, served at /local/home-panel/. The Lovelace resource
  # entry (/local/home-panel/home-panel.js?v=N) is in HA storage, not here.
  - name: ha-panel
    namespace: homeassistant
    files:
      - panel/home-panel.js
      - panel/lit-core.min.js
    options:
      disableNameSuffixHash: true
