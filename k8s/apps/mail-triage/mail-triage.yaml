---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-triage
  namespace: mail-triage
  labels:
    app: mail-triage
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO state PVC; two instances would double-process
  selector:
    matchLabels:
      app: mail-triage
  template:
    metadata:
      labels:
        app: mail-triage
    spec:
      imagePullSecrets:
        - name: c3po-registry
      securityContext:
        fsGroup: 1000 # image runs as uid 1000; state.json lives on the PVC
      containers:
        - name: mail-triage
          image: forgejo.local.bookorjeman.com/danielbook/c3po:dadc71889ead14ed8b6cf9413aa755241a11c2ba # pin to git sha from CI build; bump to deploy
          command: ["python", "mail_triage.py"]
          env:
            - name: TZ
              value: Europe/Stockholm # quiet hours are local time
            - name: IMAP_HOST
              value: imap.websupport.se
            - name: IMAP_FOLDER
              value: INBOX
            - name: OLLAMA_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: OLLAMA_MODEL
              value: qwen2.5:7b-instruct-q4_K_M
            - name: NTFY_URL
              value: http://ntfy.ntfy.svc.cluster.local
            - name: NTFY_TOPIC
              value: email
            # only read on the very first start (no state.json yet): classify
            # the newest 20 mails so there is a log to review immediately
            - name: BACKFILL
              value: "20"
          envFrom:
            - secretRef:
                name: mail-triage-env
          volumeMounts:
            - name: config
              mountPath: /config
            - name: state
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: mail-triage-config
        - name: state
          persistentVolumeClaim:
            claimName: mail-triage-state
