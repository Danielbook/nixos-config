# mail-triage — classifies new mail in the websupport.se INBOX with the
# in-cluster ollama (qwen2.5:7b) and logs one JSON line per decision. Code:
# forgejo.local.bookorjeman.com/danielbook/c3po. Plan: docs/ai-automations-plan.md.
#
# Suggest-only: every action in config.json is false until the decision log
# has been reviewed (`kubectl -n mail-triage logs deploy/mail-triage | jq`).
# config.json + few-shot.json are tunable here without an image rebuild; the
# few-shot mails are synthetic on purpose (this repo is mirrored publicly).
#
# `mail-triage-env` (IMAP_USER, IMAP_PASSWORD, NTFY_TOKEN) and `c3po-registry`
# (pull auth) are ksops `k8s/mail-triage/mail-triage-secrets.enc.yaml`.
apiVersion: v1
kind: Namespace
metadata:
  name: mail-triage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-triage-state
  namespace: mail-triage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-triage-config
  namespace: mail-triage
data:
  config.json: |
    {
      "categories": {
        "needs_reply": "a real person (friend, family, neighbour, anyone personal) writes to the owner and asks something or expects an answer",
        "bills": "an invoice or payment request the owner still has to pay (faktura, förfallodatum, påminnelse om betalning)",
        "receipts": "confirmation of something already paid or ordered: receipts, order confirmations, subscription charges",
        "school_family": "school, preschool and the kids' activities: sports teams and clubs (kallelse, träning, match, föreningsutskick), church and community groups the family takes part in, parent communication (skola, förskola, vårdnadshavare)",
        "newsletters": "newsletters, digests and marketing sent to many people — including shops, brands and services sending offers or product news, even when addressed personally by name",
        "notifications": "automated messages from a service: deliveries, appointment reminders, account and security alerts",
        "work": "the owner's job: colleagues, clients, projects",
        "other": "mail from a real person that needs no answer and fits nothing above. Automated or noreply senders are never 'other'",
        "unsure": "none of the other categories clearly fits"
      },
      "actions": {
        "move": false,
        "flag_colours": false,
        "notify": false
      },
      "flag_colours": {
        "needs_reply": "red",
        "bills": "orange",
        "school_family": "purple",
        "work": "blue"
      },
      "quiet_hours": "22:00-07:00"
    }
  few-shot.json: |
    [
