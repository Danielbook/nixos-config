# forgejo-runner — Forgejo Actions CI (GH-Actions-compatible). Registered
# offline via shared secret (forgejo-runner ksops secret; server side is
# `forgejo-cli actions register --secret` in the forgejo pod). Jobs run in
# containers on the privileged dind sidecar. Labels map ubuntu-latest to
# catthehacker's act image for GH workflow compat.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo
data:
  config.yml: |
    runner:
      file: /data/.runner
      labels:
        - docker:docker://node:22-bookworm
        - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO data PVC
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      securityContext:
        fsGroup: 1000 # runner image runs uid 1000; PVC otherwise root-owned
      initContainers:
        - name: register
          image: code.forgejo.org/forgejo/runner:12
          command:
            - sh
            - -c
            - >
              test -f /data/.runner ||
              (cd /data && forgejo-runner create-runner-file
              --instance http://forgejo.forgejo.svc.cluster.local:3000
              --secret "$RUNNER_SECRET" --name k8s-runner)
          envFrom:
            - secretRef:
                name: forgejo-runner
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:12
          workingDir: /data
          command: [forgejo-runner, daemon, --config, /config/config.yml]
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
          resources:
            requests:
              memory: 128Mi
              cpu: 25m
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: docker-certs
              mountPath: /certs
        - name: dind
          image: docker:29.6.1-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          resources:
            requests:
              memory: 128Mi
              cpu: 25m
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: docker-certs
          emptyDir: {}
