# forgejo — self-hosted git for personal apps (community Gitea fork, GH-Actions
# compatible CI later via forgejo-runner). SQLite on the PVC — single user, no
# Postgres needed. No ksops secret: security keys auto-generate on first boot.
# INSTALL_LOCK skips the web installer; first registered user became admin,
# registration now closed.
# HTTPS-only — git remotes over https with a Forgejo token, no SSH exposure
# (ponytail: add a Traefik TCP entrypoint or LB if SSH ever wanted). HTTP route
# in k8s/infra/ingress.yaml (no forward-auth — git clients need Forgejo's own auth).
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO data PVC — no rolling overlap
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:13
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true" # admin account created 2026-07-17; no public signup
            - name: FORGEJO__server__DOMAIN
              value: forgejo.local.bookorjeman.com
            - name: FORGEJO__server__ROOT_URL
              value: https://forgejo.local.bookorjeman.com/
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector:
    app: forgejo
  ports:
    - port: 3000
      targetPort: 3000
